<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements & Feed | MY CAMU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="announcements">

  <div class="app-container">
    <aside class="app-sidebar" id="appSidebar"></aside>

    <div class="app-main">
      <div class="demo-banner">
        <div>
          <i class="bi bi-megaphone-fill me-1 text-primary"></i>
          <strong>MOHAN BABU UNIVERSITY</strong> &bull; Official Circulars & Activity Feed
        </div>
        <div>
          <span class="badge-demo">Demonstration Notices</span>
        </div>
      </div>

      <header class="app-topbar" id="appTopbar"></header>

      <main class="app-content">
        <div class="page-header">
          <div class="page-title-box">
            <h2 class="page-title"><i class="bi bi-megaphone-fill text-primary"></i> Announcements & Circulars</h2>
            <p class="page-subtitle">Administrative university notices, examination alerts, campus drives, and student affairs.</p>
          </div>
        </div>

        <div class="row g-3" id="announcementsListContainer"></div>
      </main>

      <footer class="app-footer" id="appFooter"></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utilities.js"></script>
  <script src="js/navigation.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      CamuNav.init("announcements", [{ label: "Announcements", href: "announcements.html" }]);
      
      const container = document.getElementById("announcementsListContainer");
      const list = CamuStorage.getAnnouncements();
      let html = "";
      list.forEach(a => {
        html += `
          <div class="col-12 mb-3">
            <div class="camu-card">
              <div class="camu-card-header">
                <div class="d-flex align-items-center gap-2">
                  <span class="badge ${a.priority === 'Urgent' ? 'bg-danger' : a.priority === 'High' ? 'bg-warning text-dark' : 'bg-primary'}">${a.category}</span>
                  ${a.pinned ? '<span class="badge bg-light text-dark border"><i class="bi bi-pin-angle-fill me-1"></i>Pinned</span>' : ''}
                </div>
                <span class="text-muted small">${CamuUtils.formatDate(a.publishedDate)}</span>
              </div>
              <div class="camu-card-body">
                <h5 class="fw-bold text-main mb-1">${a.title}</h5>
                <div class="text-muted small mb-3"><i class="bi bi-building me-1"></i>Issued by: ${a.publisher}</div>
                <p class="text-muted small mb-0">${a.content}</p>
              </div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    });
  </script>
</body>
</html>
