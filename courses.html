<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Courses | MY CAMU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="courses">

  <div class="app-container">
    <aside class="app-sidebar" id="appSidebar"></aside>

    <div class="app-main">
      <div class="demo-banner">
        <div>
          <i class="bi bi-book-half me-1 text-primary"></i>
          <strong>My Enrolled Courses</strong> &bull; Semester 6 Curriculum (24 Credits)
        </div>
        <div>
          <span class="badge-demo">Demonstration Data</span>
        </div>
      </div>

      <header class="app-topbar" id="appTopbar"></header>

      <main class="app-content">
        <div class="page-header">
          <div class="page-title-box">
            <h2 class="page-title"><i class="bi bi-book-half text-primary"></i> Enrolled Courses</h2>
            <p class="page-subtitle">Curriculum, syllabus modules, assigned faculty, and credit allocations.</p>
          </div>
          <div class="page-actions">
            <a href="lms.html" class="btn btn-primary">
              <i class="bi bi-laptop me-1"></i> Open LMS Portal
            </a>
          </div>
        </div>

        <!-- Filter Toolbar -->
        <div class="filter-toolbar">
          <div class="search-box">
            <i class="bi bi-search"></i>
            <input type="text" id="courseSearchInput" placeholder="Search by course code, title, or faculty...">
          </div>
          <div class="filter-group">
            <select class="filter-select" id="courseCategoryFilter">
              <option value="all">All Course Types</option>
              <option value="core">Program Core</option>
              <option value="elective">Professional Elective</option>
            </select>
            <span class="text-muted small">Showing 7 Enrolled Courses</span>
          </div>
        </div>

        <!-- Courses Cards Grid -->
        <div class="row g-3" id="coursesListContainer"></div>
      </main>

      <footer class="app-footer" id="appFooter"></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utilities.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/academics.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      CamuNav.init("courses", [{ label: "My Courses", href: "courses.html" }]);
      CamuAcademics.initCourses();
    });
  </script>
</body>
</html>
