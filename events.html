<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Events & Clubs | MY CAMU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="events">

  <div class="app-container">
    <aside class="app-sidebar" id="appSidebar"></aside>

    <div class="app-main">
      <div class="demo-banner">
        <div>
          <i class="bi bi-stars me-1 text-primary"></i>
          <strong>MOHAN BABU UNIVERSITY</strong> &bull; Campus Student Activities & Technical Clubs
        </div>
        <div>
          <span class="badge-demo">Demonstration Data</span>
        </div>
      </div>

      <header class="app-topbar" id="appTopbar"></header>

      <main class="app-content">
        <div class="page-header">
          <div class="page-title-box">
            <h2 class="page-title"><i class="bi bi-stars text-primary"></i> Campus Events & Student Clubs</h2>
            <p class="page-subtitle">National technical symposiums, 36-hour hackathons, cultural festivals, and active society memberships.</p>
          </div>
        </div>

        <!-- Student Club Memberships -->
        <h5 class="fw-bold mb-3"><i class="bi bi-people-fill text-primary me-2"></i>My Active Club Memberships</h5>
        <div class="row g-3 mb-4" id="clubsListContainer"></div>

        <!-- Upcoming Campus Events -->
        <h5 class="fw-bold mb-3"><i class="bi bi-calendar-event-fill text-primary me-2"></i>Upcoming Campus Festivals & Workshops</h5>
        <div class="row g-3" id="eventsListContainer"></div>
      </main>

      <footer class="app-footer" id="appFooter"></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utilities.js"></script>
  <script src="js/navigation.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      CamuNav.init("events", [{ label: "Events & Clubs", href: "events.html" }]);
      
      // Render Clubs
      const clubs = CamuStorage.get("clubs") || [];
      const clContainer = document.getElementById("clubsListContainer");
      let clHtml = "";
      clubs.forEach(c => {
        clHtml += `
          <div class="col-md-4 mb-3">
            <div class="camu-card p-3">
              <div class="d-flex align-items-center gap-3">
                <div class="rounded-circle p-2.5 bg-primary-subtle text-primary fs-3">
                  <i class="bi ${c.icon}"></i>
                </div>
                <div>
                  <h6 class="fw-bold text-main mb-1">${c.name}</h6>
                  <div class="badge bg-success-subtle text-success small mb-1">${c.role}</div>
                  <div class="text-muted small">${c.members} Active Student Members</div>
                </div>
              </div>
            </div>
          </div>
        `;
      });
      clContainer.innerHTML = clHtml;

      // Render Events
      const events = CamuStorage.get("events") || [];
      const evContainer = document.getElementById("eventsListContainer");
      let evHtml = "";
      events.forEach(e => {
        evHtml += `
          <div class="col-lg-6 mb-4">
            <div class="camu-card">
              <div class="camu-card-header">
                <span class="badge bg-primary">${e.category}</span>
                <span class="badge bg-success-subtle text-success">${e.prizePool}</span>
              </div>
              <div class="camu-card-body">
                <h5 class="fw-bold text-main mb-1">${e.title}</h5>
                <div class="text-muted small mb-2"><i class="bi bi-building me-1"></i>Organized by: ${e.club}</div>
                <p class="text-muted small mb-3">${e.description}</p>
                <div class="row g-2 small text-muted border-top pt-2">
                  <div class="col-6"><span><i class="bi bi-calendar3 me-1"></i>Date: <strong>${e.date}</strong></span></div>
                  <div class="col-6"><span><i class="bi bi-geo-alt me-1"></i>Venue: <strong>${e.venue}</strong></span></div>
                </div>
              </div>
              <div class="camu-card-footer">
                ${e.registered ? `<span class="badge bg-success py-1.5 px-3"><i class="bi bi-check-circle me-1"></i>Registered (Team: ${e.teamName})</span>` : `
                  <button type="button" class="btn btn-sm btn-primary" onclick="CamuUtils.showToast('Registration ticket generated for ${e.title}!', 'success', 'Registered')">
                    Register for Event
                  </button>
                `}
              </div>
            </div>
          </div>
        `;
      });
      evContainer.innerHTML = evHtml;
    });
  </script>
</body>
</html>
