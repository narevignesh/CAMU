<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grievance & Helpdesk | MY CAMU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="grievances">

  <div class="app-container">
    <aside class="app-sidebar" id="appSidebar"></aside>

    <div class="app-main">
      <div class="demo-banner">
        <div>
          <i class="bi bi-shield-check me-1 text-primary"></i>
          <strong>MOHAN BABU UNIVERSITY</strong> &bull; Student Grievance Redressal & Support Helpdesk
        </div>
        <div>
          <span class="badge-demo">Demonstration Tickets</span>
        </div>
      </div>

      <header class="app-topbar" id="appTopbar"></header>

      <main class="app-content">
        <div class="page-header">
          <div class="page-title-box">
            <h2 class="page-title"><i class="bi bi-shield-check text-primary"></i> Student Grievance & Helpdesk</h2>
            <p class="page-subtitle">Submit academic, examination, or hostel issues and track institutional resolution timelines.</p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newGrievanceModal">
              <i class="bi bi-plus-lg me-1"></i> Submit New Grievance
            </button>
          </div>
        </div>

        <div class="row g-4" id="grievanceTicketsContainer"></div>
      </main>

      <footer class="app-footer" id="appFooter"></footer>
    </div>
  </div>

  <!-- New Grievance Modal -->
  <div class="modal fade" id="newGrievanceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0 shadow">
        <div class="modal-header border-bottom p-3">
          <h5 class="fw-bold mb-0">Submit Grievance Ticket</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form onsubmit="handleGrievanceSubmit(event)">
          <div class="modal-body p-4">
            <div class="mb-3">
              <label class="form-label">Category</label>
              <select class="form-select" id="grvCategorySelect">
                <option value="Examinations & Marks">Examinations & Marks</option>
                <option value="Academic & Attendance">Academic & Attendance</option>
                <option value="Fees & Accounts">Fees & Accounts</option>
                <option value="Campus Infrastructure & Wi-Fi">Campus Infrastructure & Wi-Fi</option>
                <option value="Hostel & Transportation">Hostel & Transportation</option>
                <option value="Library Services">Library Services</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Subject / Issue Summary</label>
              <input type="text" class="form-control" id="grvSubjectInput" placeholder="Brief summary of your grievance..." required>
            </div>
            <div class="mb-3">
              <label class="form-label">Detailed Description</label>
              <textarea class="form-control" id="grvDescInput" rows="4" placeholder="Explain the issue thoroughly, mentioning relevant dates and courses..." required></textarea>
            </div>
          </div>
          <div class="modal-footer p-2">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary fw-bold">Submit Ticket</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utilities.js"></script>
  <script src="js/navigation.js"></script>

  <script>
    function renderGrievances() {
      const container = document.getElementById("grievanceTicketsContainer");
      const list = CamuStorage.getGrievances();
      let html = "";
      list.forEach(g => {
        let timelineHtml = "";
        (g.timeline || []).forEach(t => {
          timelineHtml += `
            <div class="timeline-item">
              <div class="timeline-dot ${g.status === 'Resolved' ? 'success' : 'warning'}"></div>
              <div class="timeline-content">
                <div class="d-flex justify-content-between small text-muted mb-1">
                  <strong>${t.author}</strong>
                  <span>${t.date}</span>
                </div>
                <div class="small text-main">${t.text}</div>
              </div>
            </div>
          `;
        });

        html += `
          <div class="col-lg-6 mb-4">
            <div class="camu-card">
              <div class="camu-card-header flex-wrap">
                <div>
                  <span class="badge bg-primary-subtle text-primary font-monospace me-1">${g.id}</span>
                  <span class="badge bg-light text-dark border">${g.category}</span>
                </div>
                <span class="badge ${g.status === 'Resolved' ? 'bg-success' : 'bg-warning text-dark'}">${g.status}</span>
              </div>
              <div class="camu-card-body">
                <h5 class="fw-bold text-main mb-2">${g.subject}</h5>
                <p class="text-muted small mb-3">${g.description}</p>

                <h6 class="fw-bold text-main small mb-3"><i class="bi bi-clock-history me-1"></i>Resolution Timeline:</h6>
                <div class="camu-timeline">
                  ${timelineHtml}
                </div>
              </div>
              <div class="camu-card-footer">
                <span class="text-muted small">Submitted on: ${CamuUtils.formatDate(g.submissionDate)}</span>
                <span class="badge bg-secondary-subtle text-secondary">Priority: ${g.priority}</span>
              </div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function handleGrievanceSubmit(e) {
      e.preventDefault();
      const category = document.getElementById("grvCategorySelect").value;
      const subject = document.getElementById("grvSubjectInput").value.trim();
      const description = document.getElementById("grvDescInput").value.trim();
      CamuStorage.addGrievance({ category, subject, description });
      bootstrap.Modal.getInstance(document.getElementById("newGrievanceModal"))?.hide();
      CamuUtils.showToast("Grievance ticket created and assigned to Dean of Student Affairs.", "success", "Ticket Submitted");
      renderGrievances();
    }

    document.addEventListener("DOMContentLoaded", function() {
      CamuNav.init("grievances", [{ label: "Grievances & Support", href: "grievances.html" }]);
      renderGrievances();
    });
  </script>
</body>
</html>
