<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects & Research | MY CAMU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="projects">

  <div class="app-container">
    <aside class="app-sidebar" id="appSidebar"></aside>

    <div class="app-main">
      <div class="demo-banner">
        <div>
          <i class="bi bi-kanban-fill me-1 text-primary"></i>
          <strong>MOHAN BABU UNIVERSITY</strong> &bull; Capstone & Innovation Projects Hub
        </div>
        <div>
          <span class="badge-demo">Demonstration Data</span>
        </div>
      </div>

      <header class="app-topbar" id="appTopbar"></header>

      <main class="app-content">
        <div class="page-header">
          <div class="page-title-box">
            <h2 class="page-title"><i class="bi bi-kanban-fill text-primary"></i> Projects & Research Work</h2>
            <p class="page-subtitle">Manage capstone design projects, national hackathons, milestones, and open-source repositories.</p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn btn-primary" onclick="CamuProjects.openAddModal()">
              <i class="bi bi-plus-lg me-1"></i> Add New Project
            </button>
          </div>
        </div>

        <!-- Projects Grid -->
        <div class="row g-3" id="projectsContainer"></div>
      </main>

      <footer class="app-footer" id="appFooter"></footer>
    </div>
  </div>

  <!-- Add Project Modal -->
  <div class="modal fade" id="addProjectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0 shadow">
        <div class="modal-header border-bottom p-3">
          <h5 class="fw-bold mb-0">Add Engineering Project</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="addProjectForm">
          <div class="modal-body p-4">
            <div class="mb-3">
              <label class="form-label">Project Title</label>
              <input type="text" class="form-control" id="projTitleInput" placeholder="e.g. Autonomous Drone Navigation via YOLOv8" required>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label">Category</label>
                <select class="form-select" id="projCategorySelect">
                  <option value="Capstone Design Project">Capstone Design Project</option>
                  <option value="Research & Mini Project">Research & Mini Project</option>
                  <option value="National Hackathon">National Hackathon</option>
                  <option value="Open Source Initiative">Open Source Initiative</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Domain</label>
                <input type="text" class="form-control" id="projDomainInput" placeholder="e.g. Computer Vision" required>
              </div>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label">Faculty Guide</label>
                <input type="text" class="form-control" id="projGuideInput" placeholder="e.g. Dr. Sundaram Krishnamurthy">
              </div>
              <div class="col-md-6">
                <label class="form-label">Initial Progress (%)</label>
                <input type="number" class="form-control" id="projProgressInput" min="0" max="100" value="25">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Technologies (Comma separated)</label>
              <input type="text" class="form-control" id="projTechInput" placeholder="Python, PyTorch, Docker, OpenCV">
            </div>
            <div class="mb-3">
              <label class="form-label">GitHub Repository URL</label>
              <input type="url" class="form-control" id="projGithubInput" placeholder="https://github.com/...">
            </div>
            <div class="mb-3">
              <label class="form-label">Project Description</label>
              <textarea class="form-control" id="projDescInput" rows="3" placeholder="Brief synopsis of engineering architecture and objectives..."></textarea>
            </div>
          </div>
          <div class="modal-footer p-2">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary fw-bold">Save Project</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utilities.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/projects.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      CamuNav.init("projects", [{ label: "Projects", href: "projects.html" }]);
      CamuProjects.init();
    });
  </script>
</body>
</html>
