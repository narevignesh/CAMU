<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scholarships & Financial Aid | MY CAMU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="scholarships">

  <div class="app-container">
    <aside class="app-sidebar" id="appSidebar"></aside>

    <div class="app-main">
      <div class="demo-banner">
        <div>
          <i class="bi bi-award-fill me-1 text-primary"></i>
          <strong>MOHAN BABU UNIVERSITY</strong> &bull; Institutional & Government Scholarships
        </div>
        <div>
          <span class="badge-demo">Demonstration Data</span>
        </div>
      </div>

      <header class="app-topbar" id="appTopbar"></header>

      <main class="app-content">
        <div class="page-header">
          <div class="page-title-box">
            <h2 class="page-title"><i class="bi bi-award-fill text-primary"></i> Scholarships & Financial Grants</h2>
            <p class="page-subtitle">Track merit concessions, MeitY government grants, and external industry foundation fellowships.</p>
          </div>
        </div>

        <div class="row g-3" id="scholarshipsContainer"></div>
      </main>

      <footer class="app-footer" id="appFooter"></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utilities.js"></script>
  <script src="js/navigation.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      CamuNav.init("scholarships", [{ label: "Scholarships", href: "scholarships.html" }]);
      const list = CamuStorage.get("scholarships") || [];
      const container = document.getElementById("scholarshipsContainer");
      let html = "";
      list.forEach(s => {
        html += `
          <div class="col-lg-6 mb-3">
            <div class="camu-card">
              <div class="camu-card-header">
                <span class="badge bg-primary">${s.category}</span>
                <span class="badge ${s.status.includes('Approved') ? 'bg-success-subtle text-success' : 'bg-warning-subtle text-warning'}">${s.status}</span>
              </div>
              <div class="camu-card-body">
                <h5 class="fw-bold text-main mb-1">${s.name}</h5>
                <div class="text-primary fw-bold fs-5 mb-2">${s.amount}</div>
                <div class="text-muted small mb-2"><i class="bi bi-building me-1"></i>Provider: ${s.provider}</div>
                <p class="text-muted small mb-3">${s.eligibility}</p>
                <div class="row g-2 small text-muted border-top pt-2">
                  <div class="col-6"><span>Disbursement: <strong>${s.disbursementDate}</strong></span></div>
                  <div class="col-6"><span>Validity: <strong>${s.validUntil}</strong></span></div>
                </div>
              </div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    });
  </script>
</body>
</html>
