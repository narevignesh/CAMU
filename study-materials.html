<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Materials & Handouts | MY CAMU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="materials">

  <div class="app-container">
    <aside class="app-sidebar" id="appSidebar"></aside>

    <div class="app-main">
      <div class="demo-banner">
        <div>
          <i class="bi bi-folder2-open me-1 text-primary"></i>
          <strong>Academic Study Materials Vault</strong> &bull; Lecture Notes, Presentations, Question Papers & Notebooks
        </div>
        <div>
          <span class="badge-demo">Demonstration Resources</span>
        </div>
      </div>

      <header class="app-topbar" id="appTopbar"></header>

      <main class="app-content">
        <div class="page-header">
          <div class="page-title-box">
            <h2 class="page-title"><i class="bi bi-folder2-open text-primary"></i> Study Materials & Handouts</h2>
            <p class="page-subtitle">Curated course lecture slides, past university examination papers, and Jupyter code recipes.</p>
          </div>
          <div class="page-actions">
            <a href="library.html" class="btn btn-outline-secondary">
              <i class="bi bi-collection me-1"></i> Central Digital Library
            </a>
          </div>
        </div>

        <!-- Filter Toolbar -->
        <div class="filter-toolbar">
          <div class="search-box">
            <i class="bi bi-search"></i>
            <input type="text" id="matSearchInput" placeholder="Search title, keywords, or topics...">
          </div>
          <div class="filter-group">
            <select class="filter-select" id="matCourseFilter">
              <option value="all">All Courses</option>
              <option value="CS601">CS601 - Deep Learning</option>
              <option value="CS602">CS602 - Cloud & DevOps</option>
              <option value="CS603">CS603 - NLP</option>
              <option value="CS604">CS604 - Big Data</option>
              <option value="CS605">CS605 - Cyber Security</option>
              <option value="CS606">CS606 - Web Tech</option>
            </select>
            <select class="filter-select" id="matTypeFilter">
              <option value="all">All File Types</option>
              <option value="pdf">PDF Document</option>
              <option value="code">Code / Notebook</option>
              <option value="video">Video Lecture</option>
            </select>
          </div>
        </div>

        <!-- Materials Grid -->
        <div class="row g-3" id="studyMaterialsListContainer"></div>
      </main>

      <footer class="app-footer" id="appFooter"></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utilities.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/lms.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      CamuNav.init("materials", [
        { label: "Study Materials", href: "study-materials.html" }
      ]);
      CamuLMS.initStudyMaterials();
    });
  </script>
</body>
</html>
