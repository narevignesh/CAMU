<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Timetable | MY CAMU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="timetable">

  <div class="app-container">
    <aside class="app-sidebar" id="appSidebar"></aside>

    <div class="app-main">
      <div class="demo-banner">
        <div>
          <i class="bi bi-clock-history me-1 text-primary"></i>
          <strong>Academic Timetable</strong> &bull; Semester 6 Master Schedule (Monday to Saturday)
        </div>
        <div>
          <span class="badge-demo">Demonstration Data</span>
        </div>
      </div>

      <header class="app-topbar" id="appTopbar"></header>

      <main class="app-content">
        <div class="page-header">
          <div class="page-title-box">
            <h2 class="page-title"><i class="bi bi-clock-history text-primary"></i> Class Timetable</h2>
            <p class="page-subtitle">Interactive schedule with periods, lab slots, faculty, and room locations.</p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn btn-outline-secondary" onclick="window.print()">
              <i class="bi bi-printer me-1"></i> Print Timetable
            </button>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-toolbar">
          <div class="filter-group">
            <label class="form-label mb-0 me-2 fw-bold text-main">Filter by Day:</label>
            <select class="filter-select" id="timetableDaySelector">
              <option value="all">Entire Week (Mon - Sat)</option>
              <option value="Monday">Monday</option>
              <option value="Tuesday">Tuesday</option>
              <option value="Wednesday">Wednesday</option>
              <option value="Thursday">Thursday</option>
              <option value="Friday">Friday</option>
              <option value="Saturday">Saturday</option>
            </select>
          </div>
          <div class="d-flex align-items-center gap-2">
            <span class="badge bg-primary-subtle text-primary border border-primary-subtle">Period: 60 mins</span>
            <span class="badge bg-light text-dark border">Lunch: 12:45 PM - 01:45 PM</span>
          </div>
        </div>

        <!-- Timetable Container -->
        <div id="timetableGridContainer"></div>
      </main>

      <footer class="app-footer" id="appFooter"></footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utilities.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/academics.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      CamuNav.init("timetable", [{ label: "Timetable", href: "timetable.html" }]);
      CamuAcademics.initTimetable();
    });
  </script>
</body>
</html>
